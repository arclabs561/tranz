[package]
name = "tranz"
version = "0.7.3"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["Arc <attobop@gmail.com>"]
repository = "https://github.com/arclabs561/tranz"
description = "Point-embedding knowledge graph models: TransE, RotatE, ComplEx, DistMult. GPU training via Burn (wgpu/Metal)."
keywords = ["knowledge-graph", "embeddings", "link-prediction"]
categories = ["science", "algorithms"]
readme = "README.md"
publish = true

[package.metadata.docs.rs]
features = ["burn-ndarray"]

[workspace]

[dependencies]
rand = { version = "0.9", optional = true }
lattix = { version = "0.6", default-features = false, features = ["kge"] }
rayon = "1"
thiserror = "2"
serde = { version = "1.0", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
burn = { version = "0.20", features = ["autodiff"], optional = true }
burn-ndarray = { version = "0.20", features = ["rayon"], optional = true }
burn-wgpu = { version = "0.20", optional = true }

[features]
default = ["rand"]
artifact-manifest = ["dep:serde", "dep:serde_json", "dep:sha2"]
burn-ndarray = ["dep:burn", "dep:burn-ndarray", "rand", "artifact-manifest"]
burn-wgpu = ["dep:burn", "dep:burn-wgpu", "rand", "artifact-manifest"]
# Optional serde derives on the model structs (persist/snapshot trained embeddings).
serde = ["dep:serde"]

[[bin]]
name = "tranz"
test = false
path = "src/bin/tranz.rs"
required-features = ["burn-ndarray"]

[[example]]
name = "wn18rr_kge_burn"
required-features = ["burn-ndarray"]

[[example]]
name = "wn18rr_vicinity"
required-features = ["burn-ndarray"]

[[example]]
name = "bench_wgpu"
required-features = ["burn-wgpu"]

[dev-dependencies]
proptest = "1.5"
tempfile = "3"
# Serving-layer demo (examples/wn18rr_vicinity): index trained point embeddings.
vicinity = "0.10"

[lints.rust]
missing_docs = "warn"
