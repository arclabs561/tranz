[package]
name = "tranz"
version = "0.8.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Arc <attobop@gmail.com>"]
repository = "https://github.com/arclabs561/tranz"
description = "Knowledge graph embedding models"
keywords = ["knowledge-graph", "embeddings", "link-prediction"]
categories = ["science", "algorithms"]
readme = "README.md"
publish = true
include = [
  "src/**",
  "examples/**",
  "tests/**",
  "README.md",
  "BENCHMARKS.md",
  "CHANGELOG.md",
  "LICENSE",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[package.metadata.docs.rs]
features = ["burn-flex"]

[workspace]

[dependencies]
rand = { version = "0.9", optional = true }
lattix = { version = "0.8", default-features = false, features = ["kge"] }
rayon = "1"
thiserror = "2"
tnorms = "0.2.0"
serde = { version = "1.0", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
burn = { version = "0.22", optional = true }

[features]
default = ["rand"]
artifact-manifest = ["dep:serde", "dep:serde_json", "dep:sha2"]
# CPU training on burn's `flex` backend (`burn-flex`, pure Rust + rayon + SIMD).
# Burn 0.22 selects backends through the facade's features, so the backend
# crates are no longer direct dependencies.
burn-flex = ["dep:burn", "burn/flex", "rand", "artifact-manifest"]
burn-wgpu = ["dep:burn", "burn/wgpu", "rand", "artifact-manifest"]
# Optional serde derives on the model structs (persist/snapshot trained embeddings).
serde = ["dep:serde"]

[[bin]]
name = "tranz"
test = false
path = "src/bin/tranz.rs"
required-features = ["burn-flex"]

[[test]]
name = "seeded_training"
required-features = ["burn-flex"]

[[example]]
name = "wn18rr_kge_burn"
required-features = ["burn-flex"]

[[example]]
name = "cpu_parity_metric"
required-features = ["burn-flex"]

[[example]]
name = "wn18rr_vicinity"
required-features = ["burn-flex"]

[[example]]
name = "bench_wgpu"
required-features = ["burn-wgpu"]

[dev-dependencies]
proptest = "1.5"
tempfile = "3"
# Serving-layer demo (examples/wn18rr_vicinity): index trained point embeddings.
vicinity = "0.10"

[lints.rust]
missing_docs = "warn"
