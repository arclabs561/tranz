name: Release
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          lookup-only: true
      - run: cargo test --features burn-ndarray
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # Re-running the workflow after a successful publish must not fail on
      # "crate version already exists" (cargo has no --idempotent yet:
      # rust-lang/cargo#13397).
      - name: Check if version already published
        id: published
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          count=$(curl -sf https://index.crates.io/tr/an/tranz | jq -r '.vers' | grep -Fxc "$version" || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - run: cargo publish
        if: steps.published.outputs.count == '0'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
