name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rust: stable
            lint: true
          - rust: "1.95"
            lint: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ matrix.rust }}
          components: ${{ matrix.lint && 'clippy, rustfmt' || '' }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --check
        if: matrix.lint
      - run: cargo clippy --all-targets -- -D warnings
        if: matrix.lint
      - run: cargo clippy --all-targets --features "burn-flex,burn-wgpu,rand" -- -D warnings
        if: matrix.lint
      - run: cargo test
      - run: cargo test --features burn-flex
        if: matrix.lint
      - run: cargo doc --no-deps --all-features
        if: matrix.lint
        env:
          RUSTDOCFLAGS: -Dwarnings
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semver
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          feature-group: all-features
