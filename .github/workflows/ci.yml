name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rust: stable
            lint: true
          - rust: "1.89"
            lint: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ matrix.rust }}
          components: ${{ matrix.lint && 'clippy, rustfmt' || '' }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --check
        if: matrix.lint
      - run: cargo clippy --all-targets -- -D warnings
        if: matrix.lint
      - run: cargo clippy --all-targets --features "burn-ndarray,burn-wgpu,rand" -- -D warnings
        if: matrix.lint
      - run: cargo test
      - run: cargo test --features burn-ndarray
        if: matrix.lint
      - run: cargo doc --no-deps --all-features
        if: matrix.lint
        env:
          RUSTDOCFLAGS: -Dwarnings
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: semver
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          feature-group: all-features
