name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rust: stable
            lint: true
          - rust: "1.89"
            lint: false
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: ${{ matrix.lint && 'clippy, rustfmt' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
        if: matrix.lint
      - run: cargo clippy --all-targets -- -D warnings
        if: matrix.lint
      - run: cargo clippy --all-targets --features "burn-ndarray,burn-wgpu,rand" -- -D warnings
        if: matrix.lint
      - run: cargo test
      - run: cargo test --features burn-ndarray
        if: matrix.lint
      - run: cargo doc --no-deps --all-features
        if: matrix.lint
        env:
          RUSTDOCFLAGS: -Dwarnings
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: semver
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: all-features
